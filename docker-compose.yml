# Run everything:   docker compose up --build
# Requires a .env file (create it with:  node scripts/make-env.js)
#
# Only nginx publishes a port (8080). Services talk over the private compose network,
# so the internal APIs are not reachable from your host or the internet.
services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      api-gateway: { condition: service_healthy }

  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]   # Jaeger UI -> http://localhost:16686

  api-gateway:
    build: ./services/api-gateway
    environment:
      SERVICE_NAME: api-gateway
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?run node scripts/make-env.js}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run node scripts/make-env.js}
      DEMO_MODE: ${DEMO_MODE:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,express,mongodb,ioredis
      RIDER_SERVICE_URL: "http://rider-service:3001"
      DRIVER_SERVICE_URL: "http://driver-service:3002"
      MATCHING_SERVICE_URL: "http://matching-service:3003"
      PAYMENT_SERVICE_URL: "http://payment-service:3004"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3005"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-600}"
      TRUST_PROXY: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      redis: { condition: service_healthy }
      jaeger: { condition: service_started }
    deploy:
      replicas: 2   # compose DNS round-robins across replicas

  rider-service:
    build: ./services/rider-service
    environment:
      SERVICE_NAME: rider-service
      PORT: "3001"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?run node scripts/make-env.js}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run node scripts/make-env.js}
      DEMO_MODE: ${DEMO_MODE:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,express,mongodb,ioredis
      MONGO_URL: mongodb://mongo:27017/rider_db
      MATCHING_SERVICE_URL: "http://matching-service:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      jaeger: { condition: service_started }

  driver-service:
    build: ./services/driver-service
    environment:
      SERVICE_NAME: driver-service
      PORT: "3002"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?run node scripts/make-env.js}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run node scripts/make-env.js}
      DEMO_MODE: ${DEMO_MODE:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,express,mongodb,ioredis
      MONGO_URL: mongodb://mongo:27017/driver_db
      HEARTBEAT_TTL_SEC: "${HEARTBEAT_TTL_SEC:-30}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      jaeger: { condition: service_started }

  matching-service:
    build: ./services/matching-service
    environment:
      SERVICE_NAME: matching-service
      PORT: "3003"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?run node scripts/make-env.js}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run node scripts/make-env.js}
      DEMO_MODE: ${DEMO_MODE:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,express,mongodb,ioredis
      MONGO_URL: mongodb://mongo:27017/matching_db
      DRIVER_SERVICE_URL: "http://driver-service:3002"
      PAYMENT_SERVICE_URL: "http://payment-service:3004"
      OFFER_TIMEOUT_SEC: "${OFFER_TIMEOUT_SEC:-15}"
      MAX_OFFER_ATTEMPTS: "${MAX_OFFER_ATTEMPTS:-3}"
      MAX_COMPENSATION_ROUNDS: "${MAX_COMPENSATION_ROUNDS:-5}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      jaeger: { condition: service_started }
    deploy:
      replicas: 2   # compose DNS round-robins across replicas

  payment-service:
    build: ./services/payment-service
    environment:
      SERVICE_NAME: payment-service
      PORT: "3004"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?run node scripts/make-env.js}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run node scripts/make-env.js}
      DEMO_MODE: ${DEMO_MODE:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,express,mongodb,ioredis
      MONGO_URL: mongodb://mongo:27017/payment_db
      PAYMENT_FAILURE_RATE: "${PAYMENT_FAILURE_RATE:-0}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      jaeger: { condition: service_started }

  notification-service:
    build: ./services/notification-service
    environment:
      SERVICE_NAME: notification-service
      PORT: "3005"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?run node scripts/make-env.js}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?run node scripts/make-env.js}
      DEMO_MODE: ${DEMO_MODE:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,express,mongodb,ioredis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      redis: { condition: service_healthy }
      jaeger: { condition: service_started }

volumes:
  mongo-data:
  redis-data:
