# ConfigMap = non-secret settings. Secrets (JWT_SECRET, INTERNAL_API_KEY) come from
# the shared Secret "vantra-secrets" (create it with k8s/create-secret.sh).
apiVersion: v1
kind: ConfigMap
metadata: { name: notification-service, namespace: vantra }
data:
  SERVICE_NAME: "notification-service"
  PORT: "3005"
  REDIS_URL: "redis://redis:6379"
  DEMO_MODE: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
  OTEL_NODE_ENABLED_INSTRUMENTATIONS: "http,express,mongodb,ioredis"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, namespace: vantra }
spec:
  # When an HPA manages the Deployment, replicas here is only the starting value.
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: vantra/notification-service:local
          imagePullPolicy: IfNotPresent   # image is loaded into kind/minikube, not pulled
          ports: [{ containerPort: 3005 }]
          envFrom:
            - configMapRef: { name: notification-service }
            - secretRef: { name: vantra-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # Readiness: "send me traffic?" -> 503 from /health removes the pod from the Service.
          readinessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Liveness: "restart me?" -> same endpoint but a patient threshold, so a short
          # Mongo/Redis blip does not cause restarts.
          livenessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
---
# ClusterIP Service: a stable name (notification-service) and kube-proxy spreads connections
# across the ready pods (this is the load balancing).
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: vantra }
spec:
  selector: { app: notification-service }
  ports: [{ port: 3005, targetPort: 3005 }]
