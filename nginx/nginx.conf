# nginx in front of the gateway replicas (docker-compose only; Kubernetes uses the
# Ingress + Service instead).
events {}
http {
  # Docker's internal DNS. Using a variable in proxy_pass makes nginx re-resolve
  # "api-gateway" regularly, so it sees all replicas (and new ones) instead of the
  # single IP it saw at startup.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    location / {
      set $gateway http://api-gateway:8080;
      proxy_pass $gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;          # WebSocket (Socket.IO)
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }
}
